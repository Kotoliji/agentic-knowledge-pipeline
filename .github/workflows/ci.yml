name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Generated gRPC code matches the .proto
        run: sh scripts/gen_proto.sh && git diff --exit-code src/akp/rpc

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: .cache/fastembed
          key: fastembed-bge-small-en-v1.5

      - name: Test
        env:
          AKP_TEST_FASTEMBED: "1"
        run: pytest -q
