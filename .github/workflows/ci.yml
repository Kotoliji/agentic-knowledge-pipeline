name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      redis:
        image: redis:8.10-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Generated gRPC code matches the .proto
        run: sh scripts/gen_proto.sh && git diff --exit-code src/akp/rpc

      - name: Cache embedding model
        uses: actions/cache@v5
        with:
          path: .cache/fastembed
          key: fastembed-bge-small-en-v1.5

      - name: Test
        env:
          AKP_TEST_FASTEMBED: "1"
          AKP_TEST_REDIS_URL: redis://localhost:6379
        run: pytest -q

  compose:
    # Builds the image and runs the whole stack (Qdrant, gRPC retrieval service,
    # API) with the offline agents, then checks it end to end.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Build and start the stack
        run: docker compose up -d --build --wait

      - name: Smoke test
        run: sh scripts/smoke_test.sh

      - name: Logs
        if: failure()
        run: docker compose logs
