global:
  scrape_interval: 5s

scrape_configs:
  - job_name: api
    metrics_path: /metrics/
    static_configs:
      - targets: ["api:8000"]
  - job_name: retrieval
    static_configs:
      - targets: ["retrieval:9100"]
  - job_name: ingest-worker
    static_configs:
      - targets: ["ingest-worker:9101"]
