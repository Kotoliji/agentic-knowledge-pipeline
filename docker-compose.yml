name: akp

services:
  qdrant:
    image: qdrant/qdrant:v1.19.2
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # The image has no curl/wget; bash can open a TCP connection itself.
      test: ["CMD", "bash", "-c", ":> /dev/tcp/127.0.0.1/6333"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    # Redis 8 ships the JSON and search modules the LangGraph checkpointer needs.
    image: redis:8.10-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  nats:
    image: nats:2.15-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz?js-enabled-only=true"]
      interval: 3s
      timeout: 3s
      retries: 20

  retrieval:
    build: .
    image: akp:latest
    command: ["python", "-m", "akp.retrieval_service"]
    environment:
      QDRANT_URL: http://qdrant:6333
      EMBEDDING_PROVIDER: fastembed
      SEED_CORPUS_DIR: /app/corpus
      GRPC_PORT: "50051"
      METRICS_PORT: "9100"
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import grpc; from grpc_health.v1 import health_pb2 as h, health_pb2_grpc as g;
          s = g.HealthStub(grpc.insecure_channel('localhost:50051'))
          .Check(h.HealthCheckRequest(service='akp.retrieval.v1.RetrievalService'), timeout=2).status;
          exit(0 if s == h.HealthCheckResponse.SERVING else 1)
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  api:
    image: akp:latest
    # LLM and Langfuse keys come from .env when present; without it the stack
    # runs with the offline agents.
    env_file:
      - path: .env
        required: false
    environment:
      RETRIEVAL_BACKEND: grpc
      RETRIEVAL_GRPC_TARGET: retrieval:50051
      SEED_CORPUS_DIR: ""
      CHECKPOINTER: redis
      REDIS_URL: redis://redis:6379
      INGESTION: nats
      NATS_URL: nats://nats:4222
    ports:
      - "8000:8000"
    depends_on:
      retrieval:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"
      interval: 5s
      timeout: 5s
      retries: 20

  ingest-worker:
    image: akp:latest
    command: ["python", "-m", "akp.ingest_worker"]
    environment:
      NATS_URL: nats://nats:4222
      RETRIEVAL_GRPC_TARGET: retrieval:50051
      METRICS_PORT: "9101"
    depends_on:
      nats:
        condition: service_healthy
      retrieval:
        condition: service_healthy

  # Monitoring: docker compose --profile monitoring up -d
  prometheus:
    image: prom/prometheus:v3.15.0
    profiles: [monitoring]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:13.2.4
    profiles: [monitoring]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/akp.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  qdrant_data:
  nats_data:
