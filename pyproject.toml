[project]
name = "agentic-knowledge-pipeline"
version = "0.1.0"
description = "Multi-agent document Q&A: LangGraph agents, async ingestion, tracing and LLM-as-judge evaluation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2,<2",
    "langchain>=1.4,<2",
    "langchain-core>=1.6,<2",
    "langchain-anthropic>=1.7,<2",
    "qdrant-client>=1.19,<2",
    "fastapi>=0.140",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.10",
    "pydantic-settings>=2.10",
    "grpcio>=1.84",
    "grpcio-health-checking>=1.84",
    "protobuf>=7.36",
    "langfuse>=5.0,<6",
]

[project.optional-dependencies]
dev = [
    "pytest>=9",
    "pytest-asyncio>=1.4",
    "httpx>=0.28",
    "ruff>=0.17",
    # exact pin: the generated stubs embed the generator version (checked in CI)
    "grpcio-tools==1.84.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/akp/rpc"]  # generated by scripts/gen_proto.sh

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["SIM905"]
